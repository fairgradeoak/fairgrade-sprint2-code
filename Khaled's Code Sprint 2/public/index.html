<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FairGrade - Proctoring integration demo</title><link rel="stylesheet" href="./styles.css"></head><body><header><a class="brand" href="./">Fair<span>Grade</span></a><nav><a href="./review.html">Instructor review</a></nav></header><main><h1>Proctoring integration demo</h1><p>The main exam app supplies the exam UUID and access token. This page is a standalone harness.</p><div id="auth" class="card"></div><section class="card"><label>Demo harness exam UUID<input id="exam" value="11111111-1111-4111-8111-111111111111"></label><label>Environment<select id="mode"><option value="live">Omar's live API + camera (sign-in required)</option><option value="demo">Local synthetic demonstration</option></select></label><button id="start">Load policy and consent</button><button id="stop">Stop and flush uploads</button><button id="export">Export diagnostics</button><p id="status" role="status"></p><div id="simulation" hidden><label>Synthetic signal<select id="scenario"><option>normal</option><option>phone</option><option>second_face</option><option>no_face</option><option>identity_mismatch</option></select></label></div></section><div id="monitor"></div><section class="card"><h2>Consenting participant trials</h2><p>Aliases only. Set session fields before starting. Reference alias must match the person actually enrolled.</p><label><input id="trial-consent" type="checkbox"> Written participant consent obtained</label><div class="formrow"><label>Alias<input id="alias" placeholder="P01"></label><label>Reference alias<input id="reference" placeholder="P01"></label><label>Round<select id="round"><option>baseline</option><option>tuned</option><option>integrated</option></select></label><label>Scenario<select id="trial-scenario"><option>head_movement</option><option>glasses_glare</option><option>lighting</option><option>reading_aloud</option><option>objects_nearby</option><option>identity_calibration</option><option>identity_validation</option></select></label></div><button id="identity">Record current identity distance</button></section></main><script type="module" src="./app.mjs"></script></body></html>
